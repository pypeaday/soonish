name: Build and Push Docker Image

on:
  workflow_dispatch:

  push:
    branches: [main]

env:
  IMAGE: git.paynepride.com/nic/notifiq

jobs:
  build-and-push:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Forgejo registry
        run: echo "${{ secrets.FORGEJO_TOKEN }}" | docker login git.paynepride.com -u ${{ github.actor }} --password-stdin

      - name: Build and push
        run: |
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
